# Project-local ByteTrack settings for broadcast football.
#
# Diverges from ultralytics' stock bytetrack.yaml in three places, all aimed
# at identity stability rather than at maximising per-frame recall:
#
#   track_buffer      30 -> 75
#     Stock 30 frames is 1.2 s at 25 fps -- shorter than a routine occlusion
#     behind another player, and far shorter than a player walking off the
#     near touchline and back on. 75 frames (3.0 s) keeps the lost track
#     alive long enough for the same player to be re-matched instead of
#     being issued a fresh id. reid_merge.py's re-association window
#     (HOLD_SECONDS = 1.8 s) sits inside this, so the buffer is what repairs
#     short gaps and the post-pass is what repairs the ones that outlive it.
#
#   new_track_thresh  0.25 -> 0.45
#     Stock lets any detection above the inference confidence floor spawn an
#     id, which is where ghost tracks come from: a one-frame 0.3-confidence
#     blob on the crowd line becomes a permanent player. At 0.45 a weak
#     detection can still EXTEND an existing track (that path is governed by
#     track_high_thresh/track_low_thresh, untouched) but cannot start one.
#
#   match_thresh      0.8 -> 0.9
#     The association gate is an IoU *distance*, so raising it makes
#     matching more permissive. Broadcast footage pans and zooms constantly,
#     which shrinks frame-to-frame IoU for every box on screen; at 0.8 a
#     legitimate match is rejected mid-pan and the track forks. The risk of
#     a permissive gate -- grabbing the wrong nearby player -- is bounded
#     here because players are individually small relative to their
#     separation in a wide shot.

tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.45
track_buffer: 75
match_thresh: 0.9
fuse_score: True
