base_model: D:/ml-cache/models/Mistral-7B-Instruct-v0.3-resharded

method: qlora
num_epochs: 3
batch_size: 1
gradient_accumulation_steps: 16
max_seq_length: 1024
gradient_checkpointing: true
load_in_4bit: true
bnb_4bit_compute_dtype: bfloat16
optim: paged_adamw_8bit
learning_rate: 0.0002

val_split: 0.1
eval_steps: 25
save_steps: 50
save_total_limit: 3
early_stopping_patience: 3
warmup_ratio: 0.03
lr_scheduler_type: cosine

output_dir: nexus/training/output
