models:
  # The registry is a catalog of KNOWN models, not of installed ones -- the
  # cloud entries below are listed the same way without being reachable.
  # What makes a model selectable is its provider being configured; the
  # router then fails over if a specific model turns out to be absent.
  #
  # The qwen2.5 entries are the ones actually pulled locally, and are ranked
  # above mistral:7b so a default install routes to something present.
